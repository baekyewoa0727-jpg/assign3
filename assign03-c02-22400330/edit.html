</html><!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>친구 관리 프로그램</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<!--회원의 정보를 수정하는 페이지 - edit, add 페이지를 바탕으로 구성 -->

<body>

<div class="container">

    <div class="pt-3 mt-5">
        <h1 class="fw-bold fs-4">친구 관리 프로그램</h1>
    </div>

    <div class="text-end pb-3 mb-2">
        <button type="button" class="btn btn-success">목록으로</button>
    </div>


    <div class="m-2 p-2 border border-3 rounded-3 border-primary">

        <div class="p-2 m-2 text-center">
            <h1 class="m-2 text-dark fw-bold fs-2">
                친구 정보 수정
            </h1>

            <p class="m-1 text-muted">
                친구의 정보를 수정하세요.
            </p>
        </div>


        <div class="row g-3 p-3">

            <div class="col-md-6 p-1">
                <p class="fw-bold">이름</p>
                <input
                    type="text"
                    class="form-control"
                    value="김민수"
                >
            </div>

            <div class="col-md-6 p-1">
                <p>전화번호</p>
                <input
                    type="text"
                    class="form-control"
                    value="010-1234-5678"
                >
            </div>

            <div class="col-md-6 p-1">
                <p>주소</p>
                <input
                    type="text"
                    class="form-control"
                    value="서울시 강남구"
                >
            </div>

            <div class="col-md-6 p-1">
                <p>관계</p>

                <select class="form-select">
                    <option>친구</option>
                    <option>동아리</option>
                    <option>선배</option>
                    <option>후배</option>
                    <option>가족</option>
                    <option>기타</option>
                </select>
            </div>

            <div class="col-md-6 p-1">
                <p>이메일</p>
                <input
                    type="text"
                    class="form-control"
                    value="minsu@email.com"
                >
            </div>

            <div class="col-md-6 p-1">
                <p>생일</p>
                <input
                    type="date"
                    class="form-control"
                    value="2004-03-15"
                >
            </div>

        </div>

    </div>


    <div class="text-center pt-4">
        <button class="btn btn-outline-danger btn-sm">취소</button>
        <button class="btn btn-primary btn-sm">수정하기</button>
    </div>

</div>


</body>
</html>
