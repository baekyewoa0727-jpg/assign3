<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>친구 관리 프로그램</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class ="container-5">
    <div class="p-5 m-4" >
        <h1 class="text-center text-" >친구 관리 프로그램 </h1>
        <button>목록으로</button>
    </div>
</div>

<div>
    <div>
        <h1>친구 추가하기 </h1>
        <p>새로운 친구의 정보를 입력하세요.</p>
    </div>

<div class="row">
    <div class="col-md-6">
        <p>이름</p>
    <button>이름을 입력하세요</button>
    </div>

    <div class="col-md-6">
        <p>전화번호</p>
    <button>전화번호를 입력하세요</button>
    </div>

    <div class="col-md-6">
        <p>주소</p>
    <button>주소를 입력하세요</button>
    </div>

    <div class="col-md-6">
        <p>이메일</p>
    <button>이메일을 선택하세요</button>
    </div>

    <div class="col-md-6">
        <p>생일</p>
    <button>생일을 입력하세요</button>
    </div>
</div>

<div class="text-center">
    <button class="btn btn-outline-danger btn-sm">취소</button>
    <button class="btn btn-primary btn-sm">추가하기</button>
</div>
</div>
</body>
</html>
