<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>친구 관리 프로그램</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="my.css">
</head>

<body>

<div class = "container p-5 m-5">
    <div class="d-flex justify-content-between align-items-center pt-3 mt-3">

    <h1 class="fw-bold fs-4 mb-0">
        친구 관리 프로그램
    </h1>

    <button type="button" class="btn btn-outline-success">
        목록으로
    </button>

</div>

    <div class = " p-3 pb -4 m-2 text-center ">
        <h1 class="fw-bold mt-4">친구 정보 보기</h1>
        <p class ="text-muted ">선택한 친구의 상세 정보를 확인할 수 있습니다.</p>
    </div>

    <div class ="p-2 mb-3">
        <h3 class="fw-bold pb-2">김민수</h3>
        <button class ="mb-3 btn btn-sm btn-outline-info ">친구</button>
        

<div class="row g-3 p-3 mt-3">

    <div class="col-md-6">
        <div class="border rounded-3 p-3">
            <p class="fw-bold mb-2">이름</p>
            <p class="mb-0">김민수</p>
        </div>
    </div>

    <div class="col-md-6">
        <div class="border rounded-3 p-3">
            <p class="fw-bold mb-2">전화번호</p>
            <p class="mb-0">010-1234-5678</p>
        </div>
    </div>

    <div class="col-md-6">
        <div class="border rounded-3 p-3">
            <p class="fw-bold mb-2">주소</p>
            <p class="mb-0">서울시 강남구</p>
        </div>
    </div>

    <div class="col-md-6">
        <div class="border rounded-3 p-3">
            <p class="fw-bold mb-2">관계</p>
            <p class="mb-0">친구</p>
        </div>
    </div>

    <div class="col-md-6">
        <div class="border rounded-3 p-3">
            <p class="fw-bold mb-2">이메일</p>
            <p class="mb-0">minsu@email.com</p>
        </div>
    </div>

    <div class="col-md-6">
        <div class="border rounded-3 p-3">
            <p class="fw-bold mb-2">생일</p>
            <p class="mb-0">2004-03-15</p>
        </div>
    </div>

</div>




<div class="text-center">
    <button class = "btn btn-outline-primary">이전으로</button>
    <button class =" btn btn-primary">수정하기</button>
    
</div>
</div>
</div>

</body>
</html>
