<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>친구 관리 프로그램</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
    > 
    <link rel="stylesheet" href="my.css"> 
</head> 
 
<body> 

<nav> 
    <a href="index.html">목록</a> | 
    <a href="add.html">친구 추가</a> | 
    <a href="view.html">친구 보기</a> | 
    <a href="edit.html">친구 수정</a> | 
    <a href="example.html">예제</a> 
</nav> 
 
<hr> 
 
<div class="container"> 

    <div class="pt-3 mt-5"> 
        <h1 class="fw-bold fs-4">친구 관리 프로그램</h1> 
    </div> 

    <div class="text-end pb-3 mb-2"> 
        <button type="button" class="btn btn-success">목록으로</button> 
    </div> 
 
    <div class="m-2 p-2 border border-3 rounded-3 border-primary"> 

        <div class="p-2 m-2 text-center"> 
            <h1 class="m-2 text-dark fw-bold fs-2">
                친구 정보 보기
            </h1> 

            <p class="m-1 text-muted">
                선택한 친구의 상세 정보를 확인할 수 있습니다.
            </p> 
        </div> 
 
        <div class="p-3"> 

            <h3 class="fw-bold pb-2">김민수</h3> 

            <button class="mb-3 btn btn-sm btn-outline-info">
                친구
            </button> 
 
            <div class="row g-3 p-3 mt-3"> 
 
                <div class="col-md-6 p-1"> 
                    <div class="border rounded-3 p-3"> 
                        <p class="fw-bold mb-2">이름</p> 
                        <p class="mb-0">김민수</p> 
                    </div> 
                </div> 
 
                <div class="col-md-6 p-1"> 
                    <div class="border rounded-3 p-3"> 
                        <p class="fw-bold mb-2">전화번호</p> 
                        <p class="mb-0">010-1234-5678</p> 
                    </div> 
                </div> 
 
                <div class="col-md-6 p-1"> 
                    <div class="border rounded-3 p-3"> 
                        <p class="fw-bold mb-2">주소</p> 
                        <p class="mb-0">서울시 강남구</p> 
                    </div> 
                </div> 
 
                <div class="col-md-6 p-1"> 
                    <div class="border rounded-3 p-3"> 
                        <p class="fw-bold mb-2">관계</p> 
                        <p class="mb-0">친구</p> 
                    </div> 
                </div> 
 
                <div class="col-md-6 p-1"> 
                    <div class="border rounded-3 p-3"> 
                        <p class="fw-bold mb-2">이메일</p> 
                        <p class="mb-0">minsu@email.com</p> 
                    </div> 
                </div> 
 
                <div class="col-md-6 p-1"> 
                    <div class="border rounded-3 p-3"> 
                        <p class="fw-bold mb-2">생일</p> 
                        <p class="mb-0">2004-03-15</p> 
                    </div> 
                </div> 
 
            </div> 

        </div>
 
    </div> 
 
    <div class="text-center pt-4"> 
        <button class="btn btn-outline-danger btn-sm">
            이전으로
        </button> 

        <button class="btn btn-primary btn-sm">
            수정하기
        </button> 
    </div> 
 
</div> 
 
</body> 
</html>
